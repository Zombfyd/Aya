<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tears of Aya" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Anti-tampering protection -->
    <script>
      (function() {
        // Environment checks
        const getEnvVar = (name) => {
          // Check for env variable in various formats
          const viteEnv = window.__VITE_ENV__ || {};
          return viteEnv[name] || 
                 window[name] || 
                 window['import_meta_env_' + name] || 
                 '';
        };
        
        const isProduction = getEnvVar('VITE_APP_ENVIRONMENT') === 'production';
        const debugEnabled = localStorage.getItem('aya_admin_debug') === 'true';
        const testProtectionsEnabled = localStorage.getItem('aya_test_protections') === 'true';
        
        // Admin bypass check
        const isAdminMode = isProduction ? debugEnabled : !testProtectionsEnabled;
        const shouldEnableProtections = isProduction || testProtectionsEnabled;
        
        // Log current state
        console.log('Protection Status (HTML):', {
          isProduction,
          debugEnabled,
          testProtectionsEnabled,
          isAdminMode,
          shouldEnableProtections
        });
        
        // Skip all protections in admin/dev mode
        if (isAdminMode) {
          console.info('Running in admin/development mode - security protections disabled');
          return;
        }
        
        // Track if the game is active
        let gameActive = false;
        window.addEventListener('message', (e) => {
          if (e.data && typeof e.data === 'object') {
            if (e.data.type === 'gameStateChange') {
              gameActive = e.data.active;
            }
          }
        });

        // Prevent right-click (cross-browser)
        document.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          return false;
        }, { capture: true });

        // Stop drag and drop
        document.addEventListener('dragstart', (e) => {
          e.preventDefault();
          return false;
        }, { capture: true });

        // Disable selection
        document.addEventListener('selectstart', (e) => {
          e.preventDefault();
          return false;
        }, { capture: true });

        // Enhanced keyboard shortcut prevention
        document.addEventListener('keydown', (e) => {
          // Normalized key detection for cross-browser compatibility
          const key = e.key || e.keyCode;
          const ctrlKey = e.ctrlKey || e.metaKey; // metaKey for Mac
          const shiftKey = e.shiftKey;
          const altKey = e.altKey;
          
          // Block common developer tools shortcuts
          if (
            // F12
            key === 'F12' || key === 123 ||
            // Ctrl+Shift+I (Inspect Element)
            (ctrlKey && shiftKey && (key === 'I' || key === 'i' || key === 73)) ||
            // Ctrl+Shift+J (Console)
            (ctrlKey && shiftKey && (key === 'J' || key === 'j' || key === 74)) ||
            // Ctrl+Shift+C (Inspector)
            (ctrlKey && shiftKey && (key === 'C' || key === 'c' || key === 67)) ||
            // Ctrl+U (View Source)
            (ctrlKey && (key === 'U' || key === 'u' || key === 85)) ||
            // Ctrl+S (Save)
            (ctrlKey && (key === 'S' || key === 's' || key === 83)) ||
            // Alt+F4
            (altKey && (key === 'F4' || key === 115)) ||
            // Ctrl+Shift+E (Network)
            (ctrlKey && shiftKey && (key === 'E' || key === 'e' || key === 69)) ||
            // Ctrl+P (Print/Search)
            (ctrlKey && (key === 'P' || key === 'p' || key === 80)) ||
            // Ctrl+Shift+K (Browser Console)
            (ctrlKey && shiftKey && (key === 'K' || key === 'k' || key === 75)) ||
            // Alt+Cmd+I (Safari Inspector)
            (altKey && ctrlKey && (key === 'I' || key === 'i' || key === 73)) ||
            // Cmd+Option+J (Safari Console)
            (altKey && ctrlKey && (key === 'J' || key === 'j' || key === 74))
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { capture: true });

        // Method for console object detection
        const consoleDetector = () => {
          if (!isProduction) return; // Only run in production
          
          // We define a property that will get logged to console
          const detectObj = document.createElement('div');
          let counter = 0;
          let hasTriggered = false;
          
          Object.defineProperty(detectObj, 'id', {
            get: function() {
              counter++;
              if (counter > 1 && !hasTriggered) {
                hasTriggered = true;
                // Optional response if console is inspected
                // document.body.innerHTML = '<div style="font-family: sans-serif; text-align: center; padding: 50px;">Game paused for security reasons. Please refresh the page.</div>';
              }
              return 'console-detector';
            }
          });
          
          // Leave this commented out in actual production, uncomment for testing
          // Periodically attempts to check if console is open
          // setInterval(() => {
          //   counter = 0;
          //   console.log(detectObj);
          //   console.clear();
          // }, 2000);
        };
        
        // Initialize limited protection methods
        if (shouldEnableProtections) {
          // Only use more aggressive methods in production
          if (isProduction) {
            consoleDetector();
          }
        }

        // Prevent copy/paste
        ['copy', 'cut', 'paste'].forEach(event => {
          document.addEventListener(event, (e) => {
            e.preventDefault();
            return false;
          }, { capture: true });
        });

        // More selective touch handling
        document.addEventListener('touchmove', function(e) {
          const isCanvas = e.target && e.target.tagName === 'CANVAS';
          if (isCanvas) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double-tap zoom on mobile
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          const isCanvas = e.target && e.target.tagName === 'CANVAS';
          if (isCanvas) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastTouchEnd < 300) {
              e.preventDefault();
            }
            lastTouchEnd = now;
          }
        }, { passive: false });

        // Create global admin toggle functions
        window.__toggleAyaAdmin = function(key) {
          const validKey = 'aya_admin_access';
          if (key === validKey) {
            const currentState = localStorage.getItem('aya_admin_debug') === 'true';
            localStorage.setItem('aya_admin_debug', (!currentState).toString());
            alert(`Admin mode ${!currentState ? 'enabled' : 'disabled'}. The page will reload.`);
            location.reload();
            return true;
          }
          return false;
        };
        
        window.__toggleTestProtections = function(enable) {
          // If enable is not provided, toggle the current state
          if (enable === undefined) {
            enable = localStorage.getItem('aya_test_protections') !== 'true';
          }
          
          localStorage.setItem('aya_test_protections', enable.toString());
          alert(`Test protections ${enable ? 'enabled' : 'disabled'}. The page will reload.`);
          location.reload();
          return true;
        };
      })();
    </script>

    <title>Tears of Aya</title>

    <style>
      /* Critical CSS to prevent FOUC */
      body {
        margin: 0;
        padding: 0;
        background: #242424;
        color: rgba(255, 255, 255, 0.87);
        font-family: 'Inconsolata', monospace;
        overscroll-behavior: none;
        overflow-x: hidden;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -webkit-touch-callout: none;
      }

      #root {
        width: 100%;
        height: 100vh;
        overscroll-behavior: none;
      }

      /* Loading state */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #242424;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Inconsolata', monospace;
        color: #fff;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">Loading game...</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
